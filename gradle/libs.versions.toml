# Stream Master — version catalog (CONTRACT §2).
#
# Verified 2026-11-19 against Maven Central / Google Maven:
# - media3 pinned to 1.9.0 (2026-11-22): 1.10.0/1.11.1 require compileSdk 36
#   (AAR minCompileSdk=36, verified from the AAR metadata); 1.9.0 is the
#   newest with minCompileSdk 35. Its HLS AAR still declares minSdk 23.
# - Kotlin pinned to 2.1.20 (2026-11-22): KAPT on 2.0.21 cannot read
#   Kotlin metadata 2.1.0 from 2025 libraries ("Provided Metadata instance
#   has version 2.1.0"); 2.1.20's KAPT reads it. The Compose Compiler
#   follows the Kotlin version automatically (kotlin.compose plugin).
# - libvlc-all pinned to 3.7.0 (2026-11-22): 3.7.6/3.7.7 require
#   compileSdk 36 (AAR minCompileSdk=36, verified from the AAR metadata);
#   3.7.0 is the newest verified with no compileSdk requirement
#   (minCompileSdk=1, minSdk 17). "3.0.24" does NOT exist as a library
#   version (earliest published is 3.1.0; 3.0.24 is the VLC Android *app*
#   version). libVLC 3.x API is stable, so the code's API usage
#   (LibVLC, MediaPlayer, VLCVideoLayout) is unaffected.
# - cronet-embedded is NOT on Maven Central; it resolves from Google Maven.
#   Pinned to 143.7445.0 — kept as the app's bundled network stack
#   (independent of the media3 version; CronetDataSource takes any CronetEngine).
[versions]
agp = "8.6.1"
kotlin = "2.1.20"
composeBom = "2024.09.00"
media3 = "1.9.0"
libvlc = "3.7.0"
room = "2.6.1"
datastore = "1.1.1"
workmanager = "2.9.0"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "2.7.0"
tvMaterial = "1.0.0"
tvFoundation = "1.0.0"
lifecycle = "2.8.5"
coroutines = "1.8.1"
navigationCompose = "2.8.0"
appcompat = "1.7.0"
coreKtx = "1.15.0"
documentfile = "1.0.1"
activityCompose = "1.9.3"
cronet = "143.7445.0"
nanohttpd = "2.3.1"
zxing = "3.5.3"

[libraries]
# Media3 (ExoPlayer) — primary engine on API >= 23.
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-rtsp = { group = "androidx.media3", name = "media3-exoplayer-rtsp", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-datasource-cronet = { group = "androidx.media3", name = "media3-datasource-cronet", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
# libVLC — automatic fallback engine (ExoPlayer is primary on all supported devices, minSdk 23).
libvlc-all = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }
# Compose for TV + Compose.
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
# Hilt (DI).
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# Room (local database).
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# DataStore (settings).
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# WorkManager (periodic playlist / EPG refresh).
androidx-workmanager-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
# Network (Xtream / Stalker API clients).
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
cronet-embedded = { group = "org.chromium.net", name = "cronet-embedded", version.ref = "cronet" }
# Images (channel logos, posters).
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# Coroutines.
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Phone web remote (2026-11-22): tiny embedded HTTP server + QR codes.
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
